name: Update draw archive

on:
  schedule:
    # 00:00 Asia/Shanghai = 16:00 UTC (previous day)
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.5
      - run: python scripts/update_draws.py
      - name: Commit changed archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dlt_*.json
          git diff --cached --quiet || git commit -m "data: update draw archive"
          git push

