services:
  lottery:
    build: .
    container_name: jinri-yizhu
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
    mem_limit: 512m
    cpus: 0.75
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
